services:
  orbitwatch:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: orbitwatch

    ports:
      - "8000:8000"

    volumes:
      # Persist the SQLite database outside the container
      - ./data:/app/data

      # Persist application logs outside the container
      - ./logs:/app/logs

    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO

      # Production examples:
      # ALLOWED_ORIGINS: https://your-domain.com
      # CONJUNCTION_THRESHOLD_KM: 50.0
      # SCHEDULER_INTERVAL_HOURS: 6

    env_file:
      - path: .env
        required: false

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3